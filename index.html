<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma de Limpieza de Canaletas · Agrícola Guapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B2420;
    --bg-panel: #212B26;
    --bg-panel-alt: #29342E;
    --border: #3A473F;
    --border-soft: #303C36;
    --text-primary: #F3F1EA;
    --text-muted: #9FAA9F;
    --text-faint: #6E7A72;
    --accent: #F2B705;
    --accent-dim: #7A650F;
    --water: #4FA3D1;
    --ok: #5FA777;
    --ok-bg: rgba(95,167,119,0.14);
    --warn: #F2B705;
    --warn-bg: rgba(242,183,5,0.16);
    --danger: #D6483F;
    --danger-bg: rgba(214,72,63,0.16);
    --info-bg: rgba(79,163,209,0.14);
    --radius: 10px;
    --shadow: 0 6px 20px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text-primary);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    line-height:1.5;
  }
  .zinc-stripe{
    height:10px;
    background: repeating-linear-gradient(90deg, var(--border-soft) 0 6px, var(--bg-panel-alt) 6px 12px);
    opacity:0.8;
  }
  header.top{
    background: var(--bg-panel);
    border-bottom:1px solid var(--border);
    padding: 22px 28px 18px;
  }
  .brand-row{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:14px;
  }
  .brand-mark{ width:44px; height:34px; flex-shrink:0; }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:700; letter-spacing:0.5px; font-size: 1.5rem; margin:0; text-transform:uppercase;
  }
  .brand small{
    display:block; font-family:'IBM Plex Mono', monospace; color: var(--text-muted);
    font-size:0.72rem; letter-spacing:0.08em; margin-top:2px; text-transform:uppercase;
  }
  .top-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .today-pill{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color: var(--text-muted);
    background: var(--bg-panel-alt); border:1px solid var(--border); padding:6px 12px; border-radius:999px;
  }
  .sync-pill{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem;
    padding:6px 12px; border-radius:999px; border:1px solid var(--border); cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .sync-pill .dot{ width:7px; height:7px; border-radius:50%; }
  .sync-pill.ok{ color:var(--ok); } .sync-pill.ok .dot{ background:var(--ok); }
  .sync-pill.error{ color:var(--danger); } .sync-pill.error .dot{ background:var(--danger); }
  .sync-pill.none{ color:var(--text-muted); } .sync-pill.none .dot{ background:var(--text-faint); }

  nav.tabs{
    display:flex; gap:4px; padding: 0 28px; background: var(--bg-panel);
    border-bottom:1px solid var(--border); overflow-x:auto;
  }
  nav.tabs button{
    background:none; border:none; color: var(--text-muted);
    font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.06em;
    font-size:0.78rem; font-weight:600; padding: 13px 14px 11px; cursor:pointer;
    border-bottom:3px solid transparent; white-space:nowrap;
  }
  nav.tabs button.active{ color: var(--accent); border-bottom-color: var(--accent); }
  nav.tabs button:hover{ color: var(--text-primary); }

  main{ max-width:1080px; margin:0 auto; padding: 22px 20px 60px; }

  .alert-banner{
    display:flex; gap:10px; align-items:flex-start; background: var(--warn-bg);
    border:1px solid var(--accent-dim); border-left:4px solid var(--accent);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom:18px;
  }
  .alert-banner.danger{ background: var(--danger-bg); border-left-color: var(--danger); }
  .alert-banner .icon{ font-size:1.2rem; line-height:1; }
  .alert-banner .body{ flex:1; }
  .alert-banner .body strong{ font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:0.85rem; letter-spacing:0.04em; }
  .alert-banner ul{ margin:6px 0 0; padding-left:18px; font-size:0.88rem; color:var(--text-primary); }

  .section-title{
    font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.05em;
    font-size:0.95rem; color: var(--text-muted); margin: 26px 0 12px; display:flex; align-items:center; gap:10px;
  }
  .section-title::after{ content:''; flex:1; height:1px; background: var(--border); }

  .grid-cards{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:14px; }

  .card{ background: var(--bg-panel); border:1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card-head h3{ margin:0; font-family:'Oswald',sans-serif; font-size:1.02rem; text-transform:uppercase; letter-spacing:0.02em; }
  .card-head p{ margin:2px 0 0; color:var(--text-muted); font-size:0.82rem; }

  .badge{
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em;
    padding: 3px 9px; border-radius:999px; white-space:nowrap;
  }
  .badge.ok{ color:var(--ok); background:var(--ok-bg); }
  .badge.proxima{ color:var(--water); background:var(--info-bg); }
  .badge.alerta{ color:var(--accent); background:var(--warn-bg); }
  .badge.vencida{ color:var(--danger); background:var(--danger-bg); }

  .gutter{
    margin-top:14px; position:relative; height:22px; background: var(--bg-panel-alt);
    border: 1px solid var(--border); border-bottom: 3px solid var(--border);
    border-radius: 3px 3px 8px 8px; overflow:hidden;
  }
  .gutter .fill{ position:absolute; left:0; top:0; bottom:0; border-radius: 3px 3px 8px 8px; transition: width 0.4s ease; }
  .gutter.ok .fill{ background: var(--ok); }
  .gutter.proxima .fill{ background: var(--water); }
  .gutter.alerta .fill{ background: var(--accent); }
  .gutter.vencida .fill{ background: var(--danger); }
  .gutter-label{ display:flex; justify-content:space-between; margin-top:6px; font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--text-muted); }

  .meta-row{ display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:12px; font-size:0.8rem; color:var(--text-muted); }
  .meta-row b{ color:var(--text-primary); font-weight:600; }

  .card-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }

  button.btn{
    font-family:'Inter', sans-serif; font-weight:600; font-size:0.82rem;
    border-radius:7px; border:1px solid var(--border); background: var(--bg-panel-alt);
    color: var(--text-primary); padding:8px 13px; cursor:pointer;
  }
  button.btn:hover{ border-color: var(--text-muted); }
  button.btn.primary{ background: var(--accent); color:#22270B; border-color: var(--accent); }
  button.btn.primary:hover{ filter:brightness(1.06); }
  button.btn.ghost{ background:transparent; }
  button.btn.danger-ghost{ background:transparent; color:var(--danger); border-color: var(--danger-bg); }
  button.btn.small{ padding:5px 10px; font-size:0.74rem; }

  table{ width:100%; border-collapse:collapse; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  thead th{
    text-align:left; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em;
    font-size:0.72rem; color:var(--text-muted); background:var(--bg-panel-alt); padding:10px 12px; border-bottom:1px solid var(--border);
  }
  tbody td{ padding:11px 12px; border-bottom:1px solid var(--border-soft); font-size:0.86rem; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background: rgba(255,255,255,0.02); }

  .empty-state{ text-align:center; padding: 48px 20px; color: var(--text-muted); border:1px dashed var(--border); border-radius: var(--radius); background: var(--bg-panel); }
  .empty-state h3{ font-family:'Oswald',sans-serif; color:var(--text-primary); text-transform:uppercase; }

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:flex-start; justify-content:center;
    padding: 5vh 16px; overflow-y:auto; z-index:50;
  }
  .modal{ background: var(--bg-panel); border:1px solid var(--border); border-radius: var(--radius); max-width: 540px; width:100%; padding: 22px; box-shadow: var(--shadow); }
  .modal h2{ font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:1.1rem; margin:0 0 4px; }
  .modal .sub{ color:var(--text-muted); font-size:0.82rem; margin:0 0 18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.78rem; color:var(--text-muted); margin-bottom:5px; font-weight:600; }
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=url], .field select, .field textarea{
    width:100%; background: var(--bg); border:1px solid var(--border); color:var(--text-primary);
    padding:9px 10px; border-radius:7px; font-family:'Inter',sans-serif; font-size:0.9rem;
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .field.row{ display:flex; gap:12px; }
  .field.row > div{ flex:1; }
  .checkbox-line{ display:flex; align-items:flex-start; gap:9px; margin-bottom:10px; font-size:0.87rem; }
  .checkbox-line input{ margin-top:3px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .box-scroll{ max-height:180px; overflow-y:auto; border:1px solid var(--border); border-radius:7px; padding:10px; background:var(--bg); }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background: var(--ok); color:#12200F; font-weight:600; font-size:0.86rem;
    padding:11px 18px; border-radius:8px; box-shadow:var(--shadow); z-index:80; max-width:90vw; text-align:center;
  }
  .toast.error{ background: var(--danger); color:#fff; }

  footer{ text-align:center; color:var(--text-faint); font-size:0.74rem; padding: 22px 20px 30px; font-family:'IBM Plex Mono',monospace; }

  .sync-box{ background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; max-width:640px; }
  .sync-steps{ font-size:0.86rem; color:var(--text-muted); line-height:1.7; }
  .sync-steps b{ color:var(--text-primary); }
  code.inline{ background:var(--bg-panel-alt); padding:1px 6px; border-radius:4px; font-family:'IBM Plex Mono',monospace; font-size:0.82em; color:var(--accent); }

  @media print{
    nav.tabs, .card-actions, .modal, .overlay, button{ display:none !important; }
    body{ background:#fff; color:#000; }
    .card, table{ border:1px solid #999; }
  }
  @media (max-width: 600px){
    header.top{ padding:16px; }
    main{ padding: 16px 12px 40px; }
    .card-actions{ flex-direction:column; }
    .card-actions button{ width:100%; }
    .top-right{ width:100%; justify-content:space-between; }
  }
</style>
</head>
<body>

<div class="zinc-stripe"></div>
<header class="top">
  <div class="brand-row">
    <div class="brand">
      <div>
        <h1>Cronograma de Limpieza de Canaletas</h1>
        <small>Planta de empaque</small>
      </div>
    </div>
    <div class="top-right">
      <div class="today-pill" id="todayPill">—</div>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="dashboard" class="active">Alertas y estado</button>
  <button data-tab="cronograma">Cronograma completo</button>
  <button data-tab="personal">Personal</button>
  <button data-tab="checklist">Checklist estándar</button>
  <button data-tab="historial">Historial</button>
</nav>

<main id="main"></main>

<footer>Datos sincronizados con tu Google Sheet · visibles para todo el equipo que use este archivo</footer>

<script>
(function(){
  // URL de tu Apps Script — ya conectada, no hay que volver a pegarla.
  const SYNC_URL = 'https://script.google.com/macros/s/AKfycbx_bWtjazxwv4XvU-fAgng7Bzl82emnJHAaR2h6xqec9uobto_4ycD_PxJKR01gVfkRcQ/exec';
  const LS_CACHE_KEY = 'canaletas-cache-v2';
  const DIA_MS = 86400000;

  const DEFAULT_CHECKLIST = [
    'Retirar hojas, ramas y residuos vegetales acumulados en la canaleta',
    'Limpiar bajantes y tubos de desagüe verificando flujo libre',
    'Revisar uniones, soportes y anclajes de la canaleta',
    'Verificar que no existan obstrucciones en los puntos de descarga',
    'Inspeccionar señales de óxido, fisuras o deterioro en la lámina',
    'Verificar la pendiente correcta para el flujo del agua',
    'Confirmar uso completo de EPP durante la actividad',
    'Registrar hallazgos, daños o novedades encontradas'
  ];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function addDaysISO(iso, days){
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0,10);
  }
  function diffDays(iso){
    const today = new Date(todayISO() + 'T00:00:00');
    const target = new Date(iso + 'T00:00:00');
    return Math.round((target - today) / DIA_MS);
  }
  function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' });
  }
  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function defaultData(){
    const t = todayISO();
    return {
      people: [ { id: uid(), name:'Nombre del auxiliar', role:'Auxiliar de cosecha', epp:false, alturasVigente:false, alturasVence:'', sst:false } ],
      zones: [
        { id: uid(), name:'Zona A — Recepción de fruta', location:'Techo sobre báscula y andén de recepción', frequencyDays:30, lastCleaned: addDaysISO(t,-25), encargados:[], checklist:[...DEFAULT_CHECKLIST] },
        { id: uid(), name:'Zona B — Línea de selección y empaque', location:'Techo principal sobre banda de empaque', frequencyDays:30, lastCleaned: addDaysISO(t,-14), encargados:[], checklist:[...DEFAULT_CHECKLIST] },
        { id: uid(), name:'Zona C — Bodega de embalajes', location:'Techo bodega de cajas y estibas', frequencyDays:45, lastCleaned: addDaysISO(t,-40), encargados:[], checklist:[...DEFAULT_CHECKLIST] },
      ],
      history: [],
      checklistTemplate: [...DEFAULT_CHECKLIST],
    };
  }

  let data = defaultData();
  let state = { tab:'dashboard', modal:null };
  let syncStatus = 'none'; // 'none' | 'ok' | 'error'

  function getSyncUrl(){ return SYNC_URL; }
  function cacheLocal(){ try{ localStorage.setItem(LS_CACHE_KEY, JSON.stringify(data)); }catch(e){} }
  function loadCache(){ try{ const c = localStorage.getItem(LS_CACHE_KEY); return c ? JSON.parse(c) : null; }catch(e){ return null; } }

  async function loadData(){
    const url = getSyncUrl();
    if(!url){
      const cached = loadCache();
      data = cached || defaultData();
      syncStatus = 'none';
      render();
      return;
    }
    try{
      const res = await fetch(url + '?api=data');
      const json = await res.json();
      data = {
        zones: json.zones || [],
        people: json.people || [],
        history: json.history || [],
        checklistTemplate: (json.checklistTemplate && json.checklistTemplate.length) ? json.checklistTemplate : [...DEFAULT_CHECKLIST]
      };
      cacheLocal();
      syncStatus = 'ok';
    }catch(e){
      console.error('Error cargando desde Google Sheets', e);
      const cached = loadCache();
      data = cached || defaultData();
      syncStatus = 'error';
      toast('Sin conexión con Google Sheets — mostrando la última copia guardada en este navegador', true);
    }
    render();
  }

  async function saveFull(){
    cacheLocal();
    const url = getSyncUrl();
    if(!url){
      render();
      return;
    }
    try{
      await fetch(url, { method:'POST', body: JSON.stringify({
        action:'save-full', zones:data.zones, people:data.people, checklistTemplate:data.checklistTemplate
      })});
      syncStatus = 'ok';
    }catch(e){
      console.error('Error guardando en Google Sheets', e);
      syncStatus = 'error';
      toast('No se pudo guardar en Google Sheets, se guardó localmente. Revisa tu conexión.', true);
    }
    render();
  }

  async function addHistoryEntry(entry){
    data.history.push(entry);
    cacheLocal();
    const url = getSyncUrl();
    if(!url){ render(); return; }
    try{
      await fetch(url, { method:'POST', body: JSON.stringify({ action:'add-history', entry }) });
      syncStatus = 'ok';
    }catch(e){
      console.error('Error guardando historial en Google Sheets', e);
      syncStatus = 'error';
      toast('El registro quedó guardado localmente, pero no se sincronizó con Google Sheets', true);
    }
    render();
  }

  function zoneStatus(zone){
    const nextDate = addDaysISO(zone.lastCleaned, zone.frequencyDays);
    const daysUntil = diffDays(nextDate);
    let status;
    if(daysUntil < 0) status = 'vencida';
    else if(daysUntil <= 5) status = 'alerta';
    else if(daysUntil <= 10) status = 'proxima';
    else status = 'ok';
    const elapsed = zone.frequencyDays - daysUntil;
    const pct = Math.max(0, Math.min(100, Math.round((elapsed / zone.frequencyDays) * 100)));
    return { nextDate, daysUntil, status, pct };
  }

  const STATUS_LABEL = { ok:'Al día', proxima:'Próxima', alerta:'Alerta ≤5 días', vencida:'Vencida' };

  function toast(msg, isError){
    const t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=> t.remove(), 3200);
  }


  function render(){
    document.getElementById('todayPill').textContent = 'Hoy · ' + fmtDate(todayISO());

    document.querySelectorAll('#tabs button').forEach(b=> b.classList.toggle('active', b.dataset.tab === state.tab));

    const main = document.getElementById('main');
    main.innerHTML = '';
    if(state.tab==='dashboard') main.appendChild(renderDashboard());
    if(state.tab==='cronograma') main.appendChild(renderCronograma());
    if(state.tab==='personal') main.appendChild(renderPersonal());
    if(state.tab==='checklist') main.appendChild(renderChecklistConfig());
    if(state.tab==='historial') main.appendChild(renderHistorial());

    renderModal();
  }

  function renderDashboard(){
    const wrap = document.createElement('div');
    const zonesWithStatus = data.zones.map(z=>({z, st:zoneStatus(z)}));
    const urgent = zonesWithStatus.filter(x=> x.st.status==='alerta' || x.st.status==='vencida').sort((a,b)=> a.st.daysUntil - b.st.daysUntil);

    if(urgent.length){
      const hasVencida = urgent.some(u=>u.st.status==='vencida');
      const banner = document.createElement('div');
      banner.className = 'alert-banner' + (hasVencida ? ' danger' : '');
      banner.innerHTML = `<div class="icon">${hasVencida ? '⛔' : '⚠️'}</div>
        <div class="body">
          <strong>${hasVencida ? 'Hay limpiezas vencidas' : 'Limpiezas próximas (5 días o menos)'}</strong>
          <ul>${urgent.map(u=>`<li><b>${escapeHtml(u.z.name)}</b> — ${u.st.status==='vencida' ? `vencida hace ${Math.abs(u.st.daysUntil)} día(s)` : `en ${u.st.daysUntil} día(s)`} (${fmtDate(u.st.nextDate)})</li>`).join('')}</ul>
        </div>`;
      wrap.appendChild(banner);
    } else {
      const banner = document.createElement('div');
      banner.className = 'alert-banner';
      banner.style.background = 'var(--ok-bg)'; banner.style.borderLeftColor = 'var(--ok)';
      banner.innerHTML = `<div class="icon">✅</div><div class="body"><strong>Todo al día</strong><p style="margin:4px 0 0;font-size:0.86rem;color:var(--text-primary)">Ninguna zona tiene limpieza vencida ni dentro de los próximos 5 días.</p></div>`;
      wrap.appendChild(banner);
    }

    if(syncStatus==='none'){
      const note = document.createElement('div');
      note.className = 'alert-banner';
      note.style.borderLeftColor = 'var(--water)'; note.style.background = 'var(--info-bg)';
      note.innerHTML = `<div class="icon">☁️</div><div class="body"><strong>Sin conexión con Google Sheets todavía</strong><p style="margin:4px 0 0;font-size:0.86rem;color:var(--text-primary)">Tus datos solo se están guardando en este navegador. Avísame y lo revisamos.</p></div>`;
      wrap.appendChild(note);
    }

    const title = document.createElement('div');
    title.className = 'section-title'; title.textContent = 'Estado por zona';
    wrap.appendChild(title);

    if(!data.zones.length){
      wrap.appendChild(emptyState('Aún no hay zonas configuradas', 'Agrega las zonas de canaletas de tu planta desde "Cronograma completo".'));
      return wrap;
    }

    const grid = document.createElement('div');
    grid.className = 'grid-cards';
    zonesWithStatus.sort((a,b)=> a.st.daysUntil - b.st.daysUntil).forEach(({z, st})=>{
      const card = document.createElement('div');
      card.className = 'card';
      const encargados = (z.encargados && z.encargados.length) ? z.encargados.join(', ') : 'Sin asignar';
      card.innerHTML = `
        <div class="card-head">
          <div><h3>${escapeHtml(z.name)}</h3><p>${escapeHtml(z.location)}</p></div>
          <span class="badge ${st.status}">${STATUS_LABEL[st.status]}</span>
        </div>
        <div class="gutter ${st.status}"><div class="fill" style="width:${st.pct}%"></div></div>
        <div class="gutter-label"><span>Última: ${fmtDate(z.lastCleaned)}</span><span>Próxima: ${fmtDate(st.nextDate)}</span></div>

  function fileToCompressedBase64(file, maxWidth, quality){
    maxWidth = maxWidth || 1280; quality = quality || 0.72;
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
        };
        img.onerror = reject;
        img.src = ev.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadPhotoFile(file, filenamePrefix){
    if(!file) return '';
    const url = getSyncUrl();
    if(!url){ toast('Conecta Google Sheets primero para poder subir fotos', true); return ''; }
    try{
      const { base64, mimeType } = await fileToCompressedBase64(file);
      const res = await fetch(url, { method:'POST', body: JSON.stringify({
        action:'upload-photo', base64, mimeType, filename: filenamePrefix.replace(/[^a-z0-9-]+/gi,'-') + '-' + Date.now() + '.jpg'
      })});
      const json = await res.json();
      if(!json.ok){
        console.error('Error del servidor subiendo foto', json.error);
        toast('No se pudo subir la foto: ' + (json.error || 'error desconocido en el script'), true);
        return '';
      }
      return json.url || '';
    }catch(e){
      console.error('Error subiendo foto', e);
      toast('No se pudo subir una de las fotos (error de conexión), se guardó el registro sin ella', true);
      return '';
    }
  }

  document.getElementById('tabs').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    state.tab = btn.dataset.tab;
    render();
  });

  document.getElementById('main').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    const zone = id ? data.zones.find(z=>z.id===id) : null;
    const person = id ? data.people.find(p=>p.id===id) : null;

    if(action==='complete') { state.modal = { type:'complete', data: zone }; render(); }
    if(action==='edit-zone'){ state.modal = { type:'zone', data: zone }; render(); }
    if(action==='delete-zone'){
      if(confirm('¿Eliminar esta zona y su configuración?')){ data.zones = data.zones.filter(z=>z.id!==id); saveFull(); toast('Zona eliminada'); }
    }
    if(action==='edit-person'){ state.modal = { type:'person', data: person }; render(); }
    if(action==='delete-person'){
      if(confirm('¿Eliminar esta persona?')){ data.people = data.people.filter(p=>p.id!==id); saveFull(); toast('Persona eliminada'); }
    }
  });

  loadData();
})();
</script>
</body>
</html>
